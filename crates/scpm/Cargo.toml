[package]
name = "scpm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4.6.10", features = ["derive", "env"] }
dirs = "7.0.0"
futures-util = "0.3.34"
globset = "0.4.22"
ignore = "0.4.35"
indexmap = { version = "2.14.2", features = ["serde"] }
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "stream"] }
schemars = { version = "1.2.3", features = ["indexmap2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
serde_yaml_ng = "0.10.0"
sha2 = "0.11.1"
strsim = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "time", "sync", "io-util"] }

[dev-dependencies]
assert_cmd = "2.2.2"
insta = { version = "1.49.0", features = ["json"] }
predicates = "3.1.4"
tempfile = "3.27.0"
