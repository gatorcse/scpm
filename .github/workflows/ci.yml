name: ci
on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's run still in progress. Every other run gets its own
# group (the run id): a shared group would let a newer pending main run replace an older
# pending one, even with cancel-in-progress off, and every main commit should get a run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # The integration tests are dominated by JVM start-up, Scala compiles and downloads, on a
  # 2-vCPU runner, so they are spread over parallel shards (nextest's partitioning splits by
  # test, not by test binary).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: rust coursier java sbt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ matrix.shard == 1 }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      # The tests' shared coursier cache (CARGO_TARGET_TMPDIR/coursier-cache), kept between
      # runs so release artifacts are downloaded once, not on every run and shard.
      - uses: actions/cache@v4
        with:
          path: target/tmp/coursier-cache
          key: coursier-${{ matrix.shard }}-${{ hashFiles('Cargo.lock', 'crates/scpm/tests/**') }}
          restore-keys: |
            coursier-${{ matrix.shard }}-
            coursier-
      # The worker jars depend only on worker/'s sources, so a cache hit lets the shards skip
      # sbt. The hash leaves out build output: the cache's post step hashes again after the
      # build, and must get the same key.
      - id: worker-jars
        uses: actions/cache@v4
        with:
          path: worker/target/out/jvm
          key: worker-jars-v2-${{ hashFiles('worker/**', '!worker/**/target/**', '!worker/.bsp/**') }}
      - name: Build the JVM helpers
        if: steps.worker-jars.outputs.cache-hit != 'true'
        working-directory: worker
        # sbt 2 leaves the jars as symlinks into its own cache, which the cache step would save
        # as dangling links: replace them with the files they point to.
        # `resolver/stage` copies the resolver sidecar's closure into target/out/jvm, where the
        # scpm binary of this checkout finds it (tests/resolver.rs); `resolver/test` runs its
        # own tests, which need no network.
        run: |
          sbt -batch "package; resolver/stage; resolver/test"
          find target/out/jvm -type l -print0 | while IFS= read -r -d '' link; do
            cp --remove-destination "$(readlink -f "$link")" "$link"
          done
          test -z "$(find target/out/jvm -type l)"
          find target/out/jvm -name '*.jar' | grep -q .
      - run: cargo nextest run --no-fail-fast --partition hash:${{ matrix.shard }}/4
      - run: cargo test --doc
        if: matrix.shard == 1
